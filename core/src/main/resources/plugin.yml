name: DeathHolos
main: me.soapiee.deathholos.DeathHolos
version: 1.1.6
author: Soapiee
prefix: DeathHolos

dependencies: [ ]
softdepend: [ "PlaceholderAPI", "DecentHolograms", "FancyHolograms" ]
api-version: 1.13

commands:
  adeathholos:
    description: 'DeathHolos admin commands'
    aliases: [ "adh", "admindh" ]
    usage: 'adh help'
    permission: deathholos.admin
  deathholos:
    description: 'DeathHolos admin commands'
    aliases: [ "dh" ]
    usage: 'dh help'
    permission: deathholos.player

permissions:
  deathholos.admin:
    default: op
    children:
      deathholos.admin.updatenotif: true
  deathholos.admin.reload:
    default: op
  deathholos.silentdeath:
    default: false
  deathholos.admin.updatenotif:
    default: op
  deathholos.player:
    default: true
